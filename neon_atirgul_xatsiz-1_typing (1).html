<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Rose — Senga ataldi 🌹</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;overflow-x:hidden;
background:radial-gradient(circle at 50% 25%,#29102b,#050509 72%);color:#ffe7f3;font-family:Georgia,serif}
.card{width:min(96vw,500px);padding:26px 18px 28px;text-align:center;border:1px solid #ff8bd755;border-radius:27px;
background:linear-gradient(160deg,#ffffff0d,#ffffff04);box-shadow:0 18px 65px #000a}
.tag{font:11px Arial;letter-spacing:2px;color:#ffc4e1;border:1px solid #ff9bc566;border-radius:30px;padding:8px 13px}
h1{font-size:clamp(26px,7vw,35px);color:#ffd5e7;text-shadow:0 0 20px #ff4f91;margin:19px 0 7px}
.sub,.hint,.status{font:13px Arial;color:#dcb2c8}
.typing-cursor{display:inline-block;width:2px;height:1em;background:#ff8fc4;margin-left:2px;vertical-align:-2px;animation:blink .7s infinite}
@keyframes blink{50%{opacity:0}}
.letter-text{display:inline-block;min-height:1.2em}
.stage{width:min(100%,350px);height:490px;margin:10px auto 8px;position:relative;display:grid;place-items:center}
canvas{display:block;width:100%;height:100%;object-fit:contain;background:#000;border-radius:17px;box-shadow:0 0 32px #ff4fd822}
button{border:0;border-radius:30px;padding:14px 24px;background:linear-gradient(100deg,#ffacd0,#ff4f91);color:#4a0928;
font-weight:bold;font-size:15px;cursor:pointer;box-shadow:0 7px 25px #ff4f9155}
button:disabled{opacity:.65;cursor:default}
.progress{height:5px;background:#ffffff20;border-radius:9px;max-width:280px;margin:14px auto 0;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#ffacd0,#ff4f91);transition:width .15s}
.status{min-height:18px;margin-top:9px}
.heart{position:fixed;bottom:-30px;color:#ff6ca7;pointer-events:none;animation:rise linear forwards;text-shadow:0 0 12px #ff4f91}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media(max-height:760px){.stage{height:390px}}
</style>
</head>
<body>

const canvas=document.getElementById('roseCanvas');
const ctx=canvas.getContext('2d');
const VIRTUAL_W=1080, VIRTUAL_H=1920;
const bar=document.getElementById('bar');
const statusText=document.getElementById('status');
const PHASE_RANGES={1:[0,.05],2:[.05,.28],3:[.28,.52],4:[.52,.76],5:[.76,.84],6:[.84,.94],7:[.94,.98],8:[.98,1]};
let scale=1,startTime=0,finished=false;
function resize(){
 const dpr=window.devicePixelRatio||1,rect=canvas.getBoundingClientRect();
 canvas.width=Math.max(1,Math.round(rect.width*dpr));
 canvas.height=Math.max(1,Math.round(rect.height*dpr));
 scale=Math.min(canvas.width/VIRTUAL_W,canvas.height/VIRTUAL_H);
}
function ease(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}
function draw(now){
 const t=Math.min(1,(now-startTime)/9000);
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);
 const ox=(canvas.width-VIRTUAL_W*scale)/2,oy=(canvas.height-VIRTUAL_H*scale)/2;
 ctx.setTransform(scale,0,0,scale,ox,oy);
 for(const p of paths){
   const range=PHASE_RANGES[p.phase]||[0,1];
   const pStart=range[0]+(p.phase_start||0)*(range[1]-range[0]);
   if(t<pStart)continue;
   const frac=ease((t-pStart)/Math.max(.001,range[1]-pStart));
   const pts=p.coords,count=Math.max(2,Math.floor(pts.length*frac));
   if(count<2)continue;
   ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
   for(let j=1;j<count;j++)ctx.lineTo(pts[j][0],pts[j][1]);
   ctx.save();ctx.shadowColor=p.color;ctx.shadowBlur=24*p.glow;ctx.strokeStyle=p.color;ctx.lineWidth=p.width*3.6;ctx.globalAlpha=.45;ctx.stroke();ctx.restore();
   ctx.save();ctx.shadowColor=p.color;ctx.shadowBlur=10*p.glow;ctx.strokeStyle=p.color;ctx.lineWidth=p.width*1.6;ctx.globalAlpha=.85;ctx.stroke();ctx.restore();
   ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=4;ctx.strokeStyle='#fff5fb';ctx.lineWidth=Math.max(1,p.width*.7);ctx.stroke();ctx.restore();
 }
 if(bar)bar.style.width=(t*100)+'%';
 if(t<1){requestAnimationFrame(draw)}
 else if(!finished){
   finished=true;
   statusText.textContent='Atirgul to‘liq ochildi. Sizga maktub keldi 💌';
   wrap.classList.add('show');
   envelope.classList.add('open');
   typeWriter(document.getElementById('letterText'), 'Bu gul Siz Uchun Mendan Kichik Sovga. Chunki Siz oddiy Qiz Emassiz!\nHar doim Nima Bolsa ham Sizni Yashi Koraman . ❤️', 48);
   for(let i=0;i<22;i++)setTimeout(makeHeart,i*130);
 }
}
function typeWriter(element,text,speed=55){
  element.textContent='';
  let i=0;
  const timer=setInterval(()=>{
    element.textContent+=text.charAt(i++);
    if(i>=text.length)clearInterval(timer);
  },speed);
}

function makeHeart(){
 const h=document.createElement('span');h.className='heart';h.textContent=Math.random()>.5?'♥':'♡';
 h.style.left=Math.random()*100+'vw';h.style.fontSize=(14+Math.random()*24)+'px';
 h.style.animationDuration=(4+Math.random()*4)+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),8500);
}
window.addEventListener('resize',resize);
resize();
startTime=performance.now();
requestAnimationFrame(draw);

</script>
